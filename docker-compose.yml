# Host paths default to the native layout; override with DELHI_TRANSIT_HOST_DATA_DIR,
# DELHI_TRANSIT_HOST_OTP_DIR and DELHI_TRANSIT_BIND_ADDR. Data and the OTP graph are bind-mounted,
# never copied into an image. Keys come from .env at runtime.
name: delhi-transit

services:
  otp:
    image: eclipse-temurin:21-jre
    command: ["java", "-Xmx2500m", "-jar", "/otp/otp-shaded-2.8.1.jar", "--load", "--serve", "--port", "3102", "/otp/graph"]
    volumes:
      - ${DELHI_TRANSIT_HOST_OTP_DIR:-/home/factory-user/ps1-scratch/otp}:/otp
    ports:
      - "${DELHI_TRANSIT_BIND_ADDR:-127.0.0.1}:3102:3102"
    healthcheck:
      test: ["CMD", "curl", "-sf", "-X", "POST", "http://localhost:3102/otp/gtfs/v1", "-H", "Content-Type: application/json", "-d", '{"query":"{ __schema { queryType { name } } }"}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  otp-build:
    profiles: ["build"]
    image: eclipse-temurin:21-jre
    command: ["bash", "/otp-scripts/build.sh"]
    environment:
      DELHI_TRANSIT_OTP_DIR: /otp
      DELHI_TRANSIT_DATA_DIR: /data
      DELHI_TRANSIT_JAVA: java
    volumes:
      - ./otp:/otp-scripts:ro
      - ${DELHI_TRANSIT_HOST_OTP_DIR:-/home/factory-user/ps1-scratch/otp}:/otp
      - ${DELHI_TRANSIT_HOST_DATA_DIR:-/home/factory-user/ps1-scratch/data}:/data:ro

  api:
    build: .
    env_file: .env
    environment:
      DELHI_TRANSIT_DATA_DIR: /data
      DELHI_TRANSIT_OTP_URL: http://otp:3102/otp/gtfs/v1
    volumes:
      - ${DELHI_TRANSIT_HOST_DATA_DIR:-/home/factory-user/ps1-scratch/data}:/data
    ports:
      - "${DELHI_TRANSIT_BIND_ADDR:-127.0.0.1}:3100:3100"
    depends_on:
      otp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3100/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 60s
    restart: unless-stopped
